<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <rect width="240" height="180" fill="#f1f0ea"/>
  <!-- nested chord diagram: genus 0 -->
  <line x1="22" y1="110" x2="110" y2="110" stroke="#a1a1a8" stroke-width="1.2"/>
  <path d="M36,110 Q66,56 96,110" stroke="#17171a" stroke-width="1.3" opacity="0.45"/>
  <path d="M54,110 Q66,84 78,110" stroke="#17171a" stroke-width="1.3" opacity="0.45"/>
  <g fill="#17171a" opacity="0.55">
    <circle cx="36" cy="110" r="2.6"/><circle cx="54" cy="110" r="2.6"/>
    <circle cx="78" cy="110" r="2.6"/><circle cx="96" cy="110" r="2.6"/>
  </g>
  <!-- crossing chord diagram: genus 1 -->
  <line x1="130" y1="110" x2="218" y2="110" stroke="#a1a1a8" stroke-width="1.2"/>
  <path d="M144,110 Q165,58 186,110" stroke="#3b3fb0" stroke-width="1.8"/>
  <path d="M162,110 Q183,58 204,110" stroke="#3b3fb0" stroke-width="1.8"/>
  <g fill="#3b3fb0">
    <circle cx="144" cy="110" r="3"/><circle cx="162" cy="110" r="3"/>
    <circle cx="186" cy="110" r="3"/><circle cx="204" cy="110" r="3"/>
  </g>
  <!-- the crossing point: the thing homology cannot see -->
  <circle cx="174" cy="79" r="4.6" fill="none" stroke="#3b3fb0" stroke-width="1.2" opacity="0.75"/>
  <!-- boundary operators, faint -->
  <g stroke="#17171a" opacity="0.14" stroke-width="1">
    <line x1="36" y1="140" x2="96" y2="140"/>
    <line x1="144" y1="140" x2="204" y2="140"/>
  </g>
</svg>
